name: Build Qicktick AAB

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Create Production .env File
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL='${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}'" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY='${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}'" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY='${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}'" >> .env
          echo "RAZORPAY_KEY_ID='${{ secrets.RAZORPAY_KEY_ID }}'" >> .env
          echo "RAZORPAY_KEY_SECRET='${{ secrets.RAZORPAY_KEY_SECRET }}'" >> .env
          echo "NEXT_PUBLIC_RAZORPAY_KEY_ID='${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}'" >> .env
          echo "SHIPROCKET_EMAIL='${{ secrets.SHIPROCKET_EMAIL }}'" >> .env
          echo "SHIPROCKET_PASSWORD='${{ secrets.SHIPROCKET_PASSWORD }}'" >> .env
          echo "GMAIL_APP_PASSWORD='${{ secrets.GMAIL_APP_PASSWORD }}'" >> .env

      - name: Build Web Application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_CONTENT }}" | base64 --decode > android/release.keystore

      - name: Sign AAB with Production Keystore
        run: |
          cd android
          jarsigner \
            -keystore release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qicktick-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: qicktick-aab
          path: android/app/build/outputs/bundle/release/app-release.aab